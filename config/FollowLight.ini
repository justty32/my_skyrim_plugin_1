; FollowLight — runtime fill-light hotkey (part of DaylightDungeon)
; Requires ModForgeDaylight.esp (the 4 LIGH brightness bulbs) installed + enabled.

[Controls]
; DirectX scan code for the cycle key (Off -> Dim -> Bright -> Daylight -> Blazing -> Off).
; Default 0x26 = L.  Some others: J=0x24  K=0x25  L=0x26  ;=0x27
; G=0x22  H=0x23  B=0x30  N=0x31  F1=0x3B ... F8=0x42 F9=0x43 F10=0x44 F11=0x57 F12=0x58
ToggleKey = 0x26

[Light]
; true  = the light follows the player continuously
; false = the light stays where you placed it (re-press to drop a new one)
Follow = true

; How far above the player's feet the bulb sits (world units).
HeightOffset = 120.0

[Ambient]
; Scene-wide ambient brightener (cycles Off -> Low -> Med -> High). Lifts shadowed areas across the
; WHOLE cell (complements the point light's near-field). Experimental — may have no visible effect.
; Default 0x25 = K.
ToggleKey = 0x25
